<!DOCTYPE html>
<html>

<head lang="en">
    <title>PTZ Controller Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="Id">
            <sdpi-textfield
                setting="id"
                pattern="/^[a-z ,.'-]+$/i"
                placeholder="PTZ Id"
                required>
            </sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="controllerIP">
            <sdpi-textfield
                setting="controller"
                pattern="/^[a-z ,.'-]+$/i"
                placeholder="192.168.1.101"
                required>
            </sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Control ID">
            <sdpi-textfield
                setting="controlID"
                pattern="/^[a-z ,.'-]+$/i"
                placeholder="0"
                required>
            </sdpi-textfield>
    </sdpi-item>
</body>

</html>
